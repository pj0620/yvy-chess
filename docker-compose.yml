services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: yvy
      POSTGRES_PASSWORD: yvy
      POSTGRES_DB: yvy
    ports:
      - "${YVY_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yvy -d yvy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yvy:yvy@db:5432/yvy
      STOCKFISH_PATH: /usr/games/stockfish
      YVY_BIND: 0.0.0.0:8080
      YVY_WEB_DIR: /srv/web
      YVY_CONTACT: ${YVY_CONTACT:-you@example.com}
      RUST_LOG: ${RUST_LOG:-info}
      YVY_PASSWORD: ${YVY_PASSWORD:-}
    ports:
      - "${YVY_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "yvy-server", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
