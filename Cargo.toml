[workspace]
resolver = "2"
members = ["crates/yvy-core", "crates/yvy-app", "crates/yvy-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
shakmaty = "0.30"
pgn-reader = "0.29"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The browser build: small and fast WebAssembly.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
