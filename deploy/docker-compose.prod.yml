# Production stack for one small server: Postgres, the app image (Rust server + web bundle +
# Stockfish) and Caddy, which obtains and renews the TLS certificate by itself.
#
#   cp deploy/.env.prod.example deploy/.env.prod     # then edit it
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Point the DNS A record of DOMAIN at the server before the first start; Caddy needs ports 80
# and 443 reachable to get the certificate. Only Caddy is exposed; Postgres and the app are
# reachable solely on the Compose network.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: yvy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: yvy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yvy -d yvy"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yvy:${POSTGRES_PASSWORD}@db:5432/yvy
      STOCKFISH_PATH: /usr/games/stockfish
      YVY_BIND: 0.0.0.0:8080
      YVY_WEB_DIR: /srv/web
      YVY_CONTACT: ${YVY_CONTACT:?set YVY_CONTACT to your email in deploy/.env.prod}
      YVY_PASSWORD: ${YVY_PASSWORD:-}
      YVY_ENGINE_MOVETIME_MS: ${YVY_ENGINE_MOVETIME_MS:-300}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "yvy-server", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
