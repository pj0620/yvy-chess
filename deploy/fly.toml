# Fly.io configuration. From the repo root:
#   fly launch --no-deploy --copy-config --config deploy/fly.toml   # creates the app, keeps this file
#   fly postgres create                                              # smallest size is fine
#   fly postgres attach <pg-app-name> -a <app-name>                  # sets DATABASE_URL as a secret
#   fly secrets set YVY_PASSWORD=... YVY_CONTACT=you@example.com -a <app-name>
#   fly deploy --config deploy/fly.toml --dockerfile Dockerfile
# The machine stops when idle and starts on the first request, so an unused app costs close to nothing.
app = "yvy-chess"
primary_region = "iad"

[build]

[env]
  YVY_BIND = "0.0.0.0:8080"
  YVY_WEB_DIR = "/srv/web"
  STOCKFISH_PATH = "/usr/games/stockfish"
  YVY_ENGINE_MOVETIME_MS = "300"
  RUST_LOG = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
